syntax = "proto3";

package netacc.v1;

// go_package 与本目录一致。
// 重新生成：protoc --go_out=. --go_opt=paths=source_relative internal/pb/agg.proto
option go_package = "github.com/yangjuncode/netacc/internal/pb";

// Hello 是握手发起方在握手流（protocol /netacc/agg/1.0.0）上发出的第一个
// 控制消息，用于协商一条新聚合流的参数（规格书 §4.1）。
message Hello {
  // agg_stream_id：发起方生成的 128bit 随机聚合流标识。
  // 后续所有数据路径的 PATH_ATTACH 凭此 ID 绑定到同一条聚合流。
  bytes agg_stream_id = 1;
}

// HelloAck 是接收方对 Hello 的应答：回显 agg_stream_id 即表示接受。
// 应答发出后，握手流升格为该聚合流的第一条数据路径（分离+复用混合，
// 规格书 §4.1）。
message HelloAck {
  bytes agg_stream_id = 1;
}

// PathAttach 是 PATH_ATTACH 帧（帧类型 3）的 protobuf 帧体。
//
// 它是路径绑定子流（protocol /netacc/path/1.0.0）上的第一帧：加路径方
// 在新子流上发出，凭 agg_stream_id 把该子流绑定到既有的聚合流
// （连接级认证 + ID 绑定，规格书 §4.2）。接收方校验通过后回发一帧
// 内容相同的 PATH_ATTACH 作为接受应答；agg_stream_id 不认识或
// path_id 非法时直接 reset 子流。
message PathAttach {
  // 要绑定的聚合流标识（128bit）。
  bytes agg_stream_id = 1;
  // 加路径方分配的路径标识：最低位区分发起侧（0=聚合流发起方，
  // 1=接收方），其余位为各侧单调递增计数——分侧命名空间保证
  // 双向对称加路径时 path_id 不冲突（规格书 §4.3）。
  uint64 path_id = 2;
}

// PathDrop 是 PATH_DROP 帧（帧类型 4）的 protobuf 帧体：告知对端
// 摘除其对端视角下对应 path_id 的路径。尽力而为，无应答。
message PathDrop {
  // 待摘除路径的 path_id（即 PATH_ATTACH 时加路径方分配的标识）。
  uint64 path_id = 1;
}

// PathRequest 是 PATH_REQUEST 帧（帧类型 5）的 protobuf 帧体：
// 加路径方在任意存活路径上发出，请求对端配合建立一条经中继的路径
// （中继路径的按需协调，规格书 §4.3）。帧体即中继路径描述符——
// 中继 peerID + 中继可达地址集 + 逐跳传输偏好。
//
// 逐跳偏好语义：A→C 段（发起方→中继）由 ac_addr 表达——发起方从
// 地址集挑定、随后体现到 CONNECT 的电路地址里，随帧告知对端便于
// 观测/调试；C→B 段即对端 reservation 所用传输，由对端自选，
// 不进帧体。
message PathRequest {
  // request_id：发起方在聚合流内单调递增的序号，
  // 把随后的 PATH_READY 应答关联回本请求。
  uint64 request_id = 1;
  // 中继节点 peerID（原始字节）。
  bytes relay_peer = 2;
  // 中继可达地址集（multiaddr 字节，允许带 /p2p/<relay> 后缀，
  // 接收方剥离）。对端用它们连到中继做 reservation；空集时对端
  // 只能依赖 peerstore 已有信息。
  repeated bytes relay_addrs = 3;
  // A→C 段传输偏好：发起方选定的中继地址（multiaddr 字节，
  // 即随后电路地址内嵌的那条）。信息性字段——对端可忽略。
  bytes ac_addr = 4;
}

// PathReady 是 PATH_READY 帧（帧类型 6）的 protobuf 帧体：
// 对端完成（或失败）向中继的 reservation 后回送。error 为空表示成功，
// 发起方随后经 <relay-addr>/p2p/<relay>/p2p-circuit/p2p/<对端>
// 电路地址拨 CONNECT 建中继路径。
message PathReady {
  // 回显对应 PATH_REQUEST 的 request_id。
  uint64 request_id = 1;
  // 非空 = 对端 reservation 失败原因（错误透传给发起方）。
  string error = 2;
}
